quarkus.http.test-port=8084

quarkus.index-dependency.core.group-id=io.github.braineous-ai-platform
quarkus.index-dependency.core.artifact-id=motion-core

quarkus.index-dependency.ingestion.group-id=io.github.braineous-ai-platform
quarkus.index-dependency.ingestion.artifact-id=motion-ingestion

quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.motion_event.connector=smallrye-kafka
mp.messaging.outgoing.motion_event.topic=motion_event

mp.messaging.incoming.motion-event-in.group.id=motion-time-processor-it-${quarkus.uuid}
mp.messaging.incoming.motion-event-in.auto.offset.reset=latest

quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.connection-string=mongodb://localhost:27018
quarkus.mongodb.database=motion
